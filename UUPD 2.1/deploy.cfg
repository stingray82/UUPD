# =====================================================
# Generic WordPress Plugin Deploy Config
# deploy.cfg — UUPD 2.1 ready
# =====================================================
#
# Copy this file into the root of a plugin repository as:
#
#   deploy.cfg
#
# Then replace the PLACEHOLDER values below for that plugin.
#
# IMPORTANT SECURITY NOTES
# ------------------------
# - Do NOT commit private signing keys or GitHub tokens to Git.
# - For signed updates, UUPD_SIGNING_KEY_SOURCE=prompt is the safest
#   simple/manual deployment option because the private key is entered
#   at deploy time and is not stored in this file.
# - The PUBLIC Ed25519 key belongs in the plugin's UUPD configuration.
#   The PRIVATE Ed25519 key belongs only on your release/deployment side.
#
# =====================================================
# BASIC PLUGIN DETAILS
# =====================================================

# Human-readable plugin name.
# Used when generating readme.txt (when enabled) and deployment output.
#
# Example:
# PLUGIN_NAME=My Useful Plugin
#
PLUGIN_NAME=REPLACE_WITH_PLUGIN_NAME

# Comma-separated WordPress plugin tags.
# Used only when readme.txt generation is enabled.
#
# Example:
# PLUGIN_TAGS=security, firewall, utilities
#
PLUGIN_TAGS=REPLACE_WITH_COMMA_SEPARATED_TAGS

# Plugin slug / installed plugin directory name.
#
# CRITICAL:
# This becomes the top-level folder inside the generated ZIP.
# It should normally be IDENTICAL to the directory WordPress already
# has installed for the plugin. Changing it can cause WordPress to
# install an update into a different folder instead of replacing the
# existing plugin.
#
# Example:
# PLUGIN_SLUG=my-useful-plugin
#
PLUGIN_SLUG=REPLACE_WITH_PLUGIN_SLUG

# =====================================================
# SOURCE LAYOUT
# =====================================================

# Where the plugin source lives relative to this deploy.cfg.
#
# Options:
#
#   root
#       The plugin itself is the repository root.
#
#       Example:
#         repo/
#           deploy.sh
#           deploy.cfg
#           my-plugin.php
#           includes/
#
#   folder
#       The plugin lives inside a PLUGIN_SLUG subdirectory.
#
#       Example:
#         repo/
#           deploy.sh
#           deploy.cfg
#           my-plugin/
#             my-plugin.php
#             includes/
#
SOURCE_MODE=root

# Main WordPress plugin bootstrap PHP filename.
#
# This is the file containing headers such as:
#   Plugin Name:
#   Version:
#   Requires PHP:
#
# Do NOT include the plugin directory here — just the filename.
#
# Example:
# MAIN_PLUGIN_FILE=my-useful-plugin.php
#
MAIN_PLUGIN_FILE=REPLACE_WITH_MAIN_PLUGIN_FILE.php

# =====================================================
# GITHUB / RELEASE SETTINGS
# =====================================================

# GitHub repository in OWNER/REPOSITORY format.
#
# Do not include:
#   https://github.com/
#
# Example:
# GITHUB_REPO=myaccount/my-useful-plugin
#
GITHUB_REPO=REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_REPOSITORY

# Branch containing the release version and UUPD metadata.
#
# Normally:
# RELEASE_BRANCH=main
#
RELEASE_BRANCH=main

# =====================================================
# UUPD METADATA SETTINGS
# =====================================================

# Directory in the repository used to publish UUPD metadata/assets.
#
# Typical result:
#   uupd/index.json
#
# This directory should normally be excluded from the actual plugin ZIP.
#
UUPD_DIR=uupd

# =====================================================
# RELEASE ZIP SETTINGS
# =====================================================

# Filename of the ZIP uploaded to the GitHub Release.
#
# The UUPD metadata generator creates a URL similar to:
#
#   https://github.com/OWNER/REPO/releases/latest/download/FILENAME.zip
#
# Example:
# ZIP_NAME=my-useful-plugin.zip
#
ZIP_NAME=REPLACE_WITH_PLUGIN_SLUG.zip

# =====================================================
# SHARED DEPLOYMENT HELPER SCRIPTS
# =====================================================

# PHP helper which updates/checks the WordPress plugin headers.
#
# This can be a shared copy used by all of your plugin repositories.
#
# Git Bash / MSYS example:
# HEADER_SCRIPT=/c/path/to/deployscripts/myplugin_headers.php
#
HEADER_SCRIPT=REPLACE_WITH_PATH_TO/myplugin_headers.php

# PHP helper which generates the ordinary UUPD metadata.
#
# In unsigned mode this writes the published index.json directly.
# In signed mode deploy.sh stages this metadata first, builds the ZIP,
# and then passes both to UUPD_SIGNER_SCRIPT.
#
GENERATOR_SCRIPT=REPLACE_WITH_PATH_TO/generate_index.php

# PHP helper which creates the UUPD 2.1 signed metadata envelope.
#
# Used ONLY when:
#   UUPD_SIGNED_UPDATES=1
#
UUPD_SIGNER_SCRIPT=REPLACE_WITH_PATH_TO/uupd-sign-release.php

# File containing the GitHub API token used to create/update releases.
#
# This is separate from UUPD's Ed25519 signing key.
#
# Keep this file OUTSIDE the repository.
#
# Example:
# TOKEN_FILE=/c/secure/github_token.txt
#
TOKEN_FILE=REPLACE_WITH_PATH_TO/github_token.txt

# =====================================================
# CHANGELOG / README INPUTS
# =====================================================

# Changelog source file.
#
# Used for:
# - GitHub release notes
# - UUPD metadata changelog
# - generated readme.txt, when readme generation is enabled
#
# Absolute paths are fine.
#
# Git Bash example:
# CHANGELOG_FILE=/c/Users/yourname/Documents/changelogs/my-plugin.txt
#
CHANGELOG_FILE=REPLACE_WITH_PATH_TO_CHANGELOG.txt

# Static readme content.
#
# Used only when readme.txt generation is enabled.
#
# This can normally be a repository-relative filename.
#
STATIC_FILE=static.txt

# =====================================================
# DEPLOY TARGET
# =====================================================

# Where the finished package is deployed.
#
# Options:
#
#   github
#       Commit/push generated repository changes and create/update a
#       GitHub Release containing the ZIP.
#
#   private
#       Copy the finished ZIP to DEST_DIR instead of creating a
#       GitHub Release.
#
DEPLOY_TARGET=github

# =====================================================
# DRY RUN / RELEASE SAFETY
# =====================================================

# 1 = test/build only
#     - update/check headers
#     - generate metadata
#     - build ZIP
#     - perform safety checks
#     - create signed metadata if signing is enabled
#     - DO NOT commit
#     - DO NOT push
#     - DO NOT create/update GitHub releases
#
# 0 = perform a live deployment
#
# Recommended when configuring a new plugin:
#   DRY_RUN=1
#
DRY_RUN=1

# Require the currently checked-out Git branch to equal RELEASE_BRANCH.
#
# 1 = fail deployment if the wrong branch is checked out
# 0 = do not enforce the branch
#
# Recommended for normal releases:
#   REQUIRE_RELEASE_BRANCH=1
#
REQUIRE_RELEASE_BRANCH=1

# =====================================================
# README GENERATION
# =====================================================

# Controls whether deploy.sh rebuilds readme.txt.
#
# 0 = generate readme.txt
# 1 = leave the existing readme.txt alone
#
SKIP_README_GENERATION=0

# The following values are used only when:
#   SKIP_README_GENERATION=0
#
# WordPress.org contributor usernames, comma-separated if required.
README_CONTRIBUTORS=REPLACE_WITH_WORDPRESS_CONTRIBUTORS

# Optional donation URL.
# Leave blank if not required.
README_DONATE_LINK=REPLACE_WITH_DONATION_URL

# Plugin licence identifier.
README_LICENSE=GPL-2.0-or-later

# Full licence URL.
README_LICENSE_URI=https://www.gnu.org/licenses/gpl-2.0.html

# =====================================================
# PACKAGE EXCLUDES
# =====================================================

# Space-separated files/directories/patterns which must NOT be copied
# into the release ZIP.
#
# IMPORTANT:
# Keep deploy.cfg, deployment scripts, UUPD publishing metadata and
# private/release-only material out of the distributable package.
#
# Add plugin-specific development files as required.
#
PACKAGE_EXCLUDES=.git .github .idea .vscode build node_modules uupd deploy.sh deploy.cfg *.bak *.zip

# =====================================================
# ZIP SAFETY CHECKS
# =====================================================

# Space-separated paths which cause deployment to FAIL if found inside
# the generated ZIP.
#
# These are an additional safety net after PACKAGE_EXCLUDES.
#
# Add any files that must never reach an end-user installation.
#
ZIP_FORBIDDEN_PATHS=uupd/ deploy.sh deploy.cfg

# =====================================================
# PACKAGING OPTIONS
# =====================================================

# Require rsync when constructing the release package.
#
# 1 = abort if rsync is unavailable
# 0 = allow deploy.sh's fallback copy method
#
# rsync gives more predictable exclude behaviour, so 1 is preferable
# on a controlled release machine.
#
REQUIRE_RSYNC=0

# Friendly name displayed at the start of deployment logs.
#
SCRIPT_LABEL=Plugin Deploy

# Optional custom 7-Zip executable.
#
# Uncomment when required.
#
# Example for Git Bash on Windows:
# SEVENZIP_PATH=/c/Program Files/7-Zip/7z.exe
#
#SEVENZIP_PATH=

# =====================================================
# PRIVATE DEPLOY SETTINGS
# =====================================================

# Used ONLY when:
#   DEPLOY_TARGET=private
#
# Directory where the completed ZIP should be copied.
#
# Example:
# DEST_DIR=/d/plugin-updates/packages
#
#DEST_DIR=REPLACE_WITH_PRIVATE_DEPLOY_DIRECTORY

# =====================================================
# UUPD 2.1 SIGNED UPDATES
# =====================================================

# Enable cryptographic release signing.
#
# 0 = OFF
#     Generate traditional/unsigned UUPD metadata.
#     This preserves the old deployment behaviour.
#
# 1 = ON
#     Generate an Ed25519 signed UUPD 2.1 metadata envelope.
#     The signed payload contains the SHA-256 of the finished ZIP so
#     both the update metadata and downloaded package can be verified.
#
UUPD_SIGNED_UPDATES=0

# =====================================================
# PRIVATE SIGNING KEY SOURCE
# =====================================================

# Select where deploy.sh obtains the PRIVATE Ed25519 signing key.
#
# Options:
#
#   prompt
#       RECOMMENDED for manual releases.
#
#       deploy.sh asks for the private key using a hidden terminal
#       prompt. The value is passed to the signing PHP process over
#       stdin rather than as a command-line argument.
#
#       It is NOT stored in deploy.cfg.
#
#   config
#       Read the key from UUPD_SIGNING_PRIVATE_KEY below.
#
#       Convenient, but the PRIVATE KEY IS STORED IN THIS FILE.
#       Do not commit deploy.cfg containing a real private key.
#
#   file
#       Read the key from UUPD_SIGNING_PRIVATE_KEY_FILE.
#
#       Useful for an isolated release machine or CI environment where
#       the key file can be protected separately from the repository.
#
UUPD_SIGNING_KEY_SOURCE=prompt

# =====================================================
# CONFIG-STORED PRIVATE KEY
# =====================================================

# Used ONLY when:
#
#   UUPD_SIGNED_UPDATES=1
#   UUPD_SIGNING_KEY_SOURCE=config
#
# Value:
#   Base64 Ed25519 PRIVATE/SECRET key generated by the signing helper.
#
# SECURITY:
# Never put the PUBLIC key here by mistake.
# Never commit a real PRIVATE key to a public repository.
#
# Leave blank for prompt or file modes.
#
UUPD_SIGNING_PRIVATE_KEY=

# =====================================================
# FILE-STORED PRIVATE KEY
# =====================================================

# Used ONLY when:
#
#   UUPD_SIGNED_UPDATES=1
#   UUPD_SIGNING_KEY_SOURCE=file
#
# Point this at a file containing the Base64 Ed25519 PRIVATE key.
#
# Strongly recommended:
# - keep it outside the Git repository
# - restrict filesystem permissions
# - do not copy it into plugin packages
#
# Git Bash example:
# UUPD_SIGNING_PRIVATE_KEY_FILE=/c/secure/uupd-release.key
#
UUPD_SIGNING_PRIVATE_KEY_FILE=

# =====================================================
# SIGNING KEY ID
# =====================================================

# Public identifier for the signing key.
#
# This is NOT secret.
#
# It is embedded in signed metadata and can be matched by the UUPD
# client configuration. It is primarily useful for identifying keys
# and supporting controlled key rotation later.
#
# Examples:
#   release-2026
#   primary-1
#   rup-signing-2026
#
UUPD_SIGNING_KEY_ID=release-2026

# =====================================================
# UUPD CLIENT-SIDE REMINDER
# =====================================================
#
# The PRIVATE key configured above is ONLY for the deployment system.
#
# The plugin/theme distributed to customers receives the corresponding
# PUBLIC Ed25519 key in its UUPD registration, for example:
#
#   'signed_updates'     => true,
#   'signing_public_key' => 'BASE64_PUBLIC_KEY_HERE',
#   'signing_key_id'     => 'release-2026',
#
# The public key is intentionally safe to distribute.
# The private key must never be included in the plugin/theme ZIP.
#
# =====================================================
